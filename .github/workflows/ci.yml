# Required status check for master. Runs on every PR so a merge cannot land
# code that fails to compile or test. Pull requests run it whatever branch they
# target, so a PR stacked on another PR's branch is checked too.
#
# Scope note: this deliberately does NOT run `./gradlew build`.
# - `example-script` and `sdn-test-script` reference quest constants that
#   `quest-core` only generates when `quest.research.dir` points at the research
#   data (without it the codegen emits a stub), so they cannot build from a bare
#   clone.
# - `cli` is checked (its tests, plus compiling the dev preview source set) but
#   not packaged. Nothing it reads from `local.properties` is needed for that:
#   every key is optional, and only the run and packaging tasks use them. The
#   preview renders themselves need a desktop with OpenGL, so they are not run
#   here.
name: CI

on:
  pull_request:
  push:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :api:build :core:build :test-support:build \
                    :quest-core:build :skilling-core:build :cli:check

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: ignore
          retention-days: 14
