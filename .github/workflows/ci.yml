# Required status check for master. Runs on every PR so a merge cannot land
# code that fails to compile or test.
#
# Scope note: this deliberately does NOT run `./gradlew build`. The `cli`,
# `example-script` and `sdn-test-script` modules cannot build on a clean
# checkout — `cli` wants NXTCache.dll, worldwalker.dll, an Atlas database and a
# jlink JDK home from `local.properties`, and the script modules reference quest
# constants that `quest-core` only generates when `quest.research.dir` points at
# the research data (without it the codegen emits a stub). The modules below are
# the ones that build hermetically from a bare clone.
name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :api:build :core:build :test-support:build \
                    :quest-core:build :skilling-core:build

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: ignore
          retention-days: 14
