name: Deploy Javadoc to GitHub Pages

on:
  push:
    branches: [develop]
    # A release tag redeploys the docs so the published Javadoc matches the
    # version script authors just resolved. Both this and publish-api.yml fire
    # on a v* tag; the 'pages' concurrency group keeps deploys serialised.
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Deliberately NOT named 'build'. The 'master protection' ruleset matches its
  # required check by job name, and ci.yml owns that name — see CLAUDE.md.
  javadoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew && ./gradlew :api:javadoc

      - uses: actions/upload-pages-artifact@v3
        with:
          path: api/build/docs/javadoc

  deploy:
    needs: javadoc
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
